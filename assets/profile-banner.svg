<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Eevanes — AI, data, and public value</title>
  <desc id="desc">An editorial banner with a bold introduction and an abstract blue data sculpture.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
