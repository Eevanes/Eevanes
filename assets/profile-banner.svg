  <text x="34" y="306" fill="#10131b" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">data, and public value.</text>
  <text x="36" y="355" fill="#464c57" font-family="Arial, Helvetica, sans-serif" font-size="18">Research · Tools · Real-world impact</text>
